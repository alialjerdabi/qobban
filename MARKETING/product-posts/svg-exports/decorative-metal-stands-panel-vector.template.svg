<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2966" viewBox="0 0 1080 2966" role="img" aria-labelledby="title desc">
  <title id="title">Qobban Decorative Metal Stands Offer Panel</title>
  <desc id="desc">Fully vector Qobban offer panel with editable text, price card, dividers and technical line icons. No raster image elements.</desc>

  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Almarai Embedded'; font-style: normal; font-weight: 400; src: url(data:font/ttf;base64,__ALMARAI_REGULAR__) format('truetype'); }
      @font-face { font-family: 'Almarai Embedded'; font-style: normal; font-weight: 700; src: url(data:font/ttf;base64,__ALMARAI_BOLD__) format('truetype'); }
      @font-face { font-family: 'Almarai Embedded'; font-style: normal; font-weight: 800; src: url(data:font/ttf;base64,__ALMARAI_EXTRABOLD__) format('truetype'); }
      .ar { font-family: 'Almarai Embedded', sans-serif; direction: rtl; unicode-bidi: plaintext; }
      .en { font-family: 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; }
      .yellow { fill: #FFC220; }
      .warm-white { fill: #F3F1EC; }
      .muted { fill: #D0CDC6; }
      .ink { fill: #101112; }
      .yellow-stroke { fill: none; stroke: #FFC220; stroke-linecap: round; stroke-linejoin: round; }
      .white-stroke { fill: none; stroke: #F3F1EC; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0B"/>
      <stop offset="0.5" stop-color="#131516"/>
      <stop offset="1" stop-color="#090A0B"/>
    </linearGradient>
    <radialGradient id="softLight" cx="52%" cy="35%" r="75%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="priceYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC220"/>
      <stop offset="1" stop-color="#EBAA00"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="2966" fill="url(#background)"/>
  <rect width="1080" height="2966" fill="url(#softLight)"/>
  <path d="M72 0V2966M1008 0V2966" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>

  <!-- Coordinate reference -->
  <g id="coordinate-reference" class="yellow-stroke" stroke-width="5">
    <path d="M126 114H332M210 30V198"/>
    <circle cx="210" cy="114" r="30"/>
    <circle cx="210" cy="114" r="7" fill="#FFC220" stroke="none"/>
    <path d="M210 61V82M210 146V167M157 114H178M242 114H263" stroke-width="3"/>
  </g>
  <text x="518" y="132" class="en yellow" font-size="43" font-weight="700" text-anchor="middle" letter-spacing="0.6">26.2239° N, 50.5876° E</text>

  <!-- Product heading -->
  <g id="heading" text-anchor="middle">
    <text x="540" y="390" class="ar warm-white" font-size="150" font-weight="800">ستاندات</text>
    <text x="540" y="575" class="ar warm-white" font-size="150" font-weight="800">ديكور معدنية</text>
    <text x="540" y="710" class="en yellow" font-size="74" font-weight="700" letter-spacing="0.5">DECORATIVE METAL STANDS</text>
    <text x="540" y="840" class="ar muted" font-size="57" font-weight="400">ثلاثة مقاسات. تصميم واحد متقن.</text>
    <path d="M136 920H308M772 920H944" class="yellow-stroke" stroke-width="4"/>
    <text x="540" y="936" class="en muted" font-size="43" font-weight="400">Three sizes. One precise design.</text>
  </g>

  <!-- Price card -->
  <g id="price-card">
    <path d="M105 1024H975V1666L828 1813H105Z" fill="url(#priceYellow)"/>
    <path d="M123 1042H957V1656L818 1795H123Z" fill="none" stroke="#121314" stroke-width="8"/>
    <text x="790" y="1170" class="ar ink" font-size="88" font-weight="800" text-anchor="middle">العرض:</text>
    <text x="540" y="1570" class="en ink" font-size="415" font-weight="900" text-anchor="middle" letter-spacing="-22">33</text>
    <text x="540" y="1736" class="ar ink" font-size="112" font-weight="800" text-anchor="middle">د.ب</text>
  </g>

  <!-- Feature 01: steel frame -->
  <g id="feature-steel-frame">
    <rect x="118" y="1892" width="148" height="148" rx="38" class="yellow-stroke" stroke-width="6"/>
    <rect x="157" y="1931" width="70" height="70" class="yellow-stroke" stroke-width="5"/>
    <rect x="168" y="1942" width="48" height="48" class="yellow-stroke" stroke-width="3" opacity="0.8"/>
    <text x="722" y="1978" class="ar warm-white" font-size="61" font-weight="400" text-anchor="middle">هيكل فولاذي</text>
    <path d="M350 2038H944" class="yellow-stroke" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Feature 02: color finish -->
  <g id="feature-colors">
    <rect x="118" y="2086" width="148" height="148" rx="38" class="yellow-stroke" stroke-width="6"/>
    <rect x="157" y="2125" width="70" height="70" class="yellow-stroke" stroke-width="5"/>
    <text x="722" y="2172" class="ar warm-white" font-size="61" font-weight="400" text-anchor="middle">ألوان أنيقة</text>
    <path d="M350 2232H944" class="yellow-stroke" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Feature 03: welding -->
  <g id="feature-welding">
    <rect x="118" y="2280" width="148" height="148" rx="38" class="yellow-stroke" stroke-width="6"/>
    <g class="yellow-stroke" stroke-width="9">
      <path d="M154 2320L231 2397"/>
      <path d="M224 2314L146 2392"/>
      <path d="M146 2313L162 2329L176 2315L160 2299Z"/>
      <path d="M218 2396L234 2412L248 2398L232 2382Z"/>
      <path d="M209 2301C222 2293 238 2297 246 2308L232 2322L218 2308L209 2317C198 2309 198 2303 209 2301Z"/>
    </g>
    <text x="722" y="2366" class="ar warm-white" font-size="61" font-weight="400" text-anchor="middle">لحام احترافي</text>
    <path d="M350 2426H944" class="yellow-stroke" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Feature 04: durability -->
  <g id="feature-durability">
    <rect x="118" y="2474" width="148" height="148" rx="38" class="yellow-stroke" stroke-width="6"/>
    <path d="M192 2510L233 2527V2565C233 2593 216 2609 192 2618C168 2609 151 2593 151 2565V2527Z" class="yellow-stroke" stroke-width="6"/>
    <path d="M171 2563L186 2578L216 2545" class="yellow-stroke" stroke-width="7"/>
    <text x="722" y="2560" class="ar warm-white" font-size="61" font-weight="400" text-anchor="middle">متين ومستقر</text>
    <path d="M350 2620H944" class="yellow-stroke" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Square tube specification -->
  <g id="square-tube-spec">
    <rect x="118" y="2708" width="826" height="182" fill="none" stroke="#FFC220" stroke-width="5"/>
    <rect x="154" y="2742" width="112" height="112" class="yellow-stroke" stroke-width="6"/>
    <rect x="171" y="2759" width="78" height="78" class="yellow-stroke" stroke-width="4"/>
    <text x="374" y="2788" class="en warm-white" font-size="57" font-weight="400">12x12 mm</text>
    <text x="374" y="2860" class="en warm-white" font-size="51" font-weight="400" letter-spacing="1.8">SQUARE TUBE</text>
  </g>
</svg>
