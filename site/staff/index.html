<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>قبان — بوابة الموظفين (تجريبي)</title>
<link rel="icon" href="/staff/assets/logo-stacked.svg?v=8" type="image/svg+xml">
<link rel="stylesheet" href="/staff/staff.css?v=8">
</head>
<body>

<!-- No login. The demo holds no real data, so a door on it only ever cost time. -->
<div id="app">
  <header class="top">
    <img src="/staff/assets/logo-lockup.svg?v=8" alt="قبان" class="top__logo">
    <nav class="tabs" id="tabs">
      <button class="tab is-on" data-view="quotes">عروض الأسعار</button>
      <button class="tab" data-view="clients">العملاء</button>
      <button class="tab" data-view="pricelist">قائمة الأسعار</button>
    </nav>
    <div class="top__right">
      <span class="who" id="who"></span>
      <button class="btn btn--quiet" id="lang" type="button">EN</button>
    </div>
  </header>

  <!-- Replaced by the app as soon as the script runs. If this text is still here,
       the script did not run — which is a far more useful thing to see than a
       button that silently does nothing. -->
  <main id="view" class="wrap">
    <p class="muted" id="bootMsg">جارٍ التحميل…</p>
  </main>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<!-- First, so it can report a failure in app.js itself. -->
<script src="/staff/boot.js?v=8"></script>
<script src="/staff/app.js?v=8"></script>
</body>
</html>
